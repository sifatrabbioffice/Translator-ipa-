Name: Build Fully Offline Unsigned IPA with XcodeGen

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create project directory and Swift files
        run: |
          mkdir -p BanglaTranslator/Sources
          mkdir -p BanglaTranslator/Resources

      - name: Write Swift source files
        run: |
          cat <<'EOF' > BanglaTranslator/Sources/BanglaTranslatorApp.swift
          import SwiftUI

          @main
          struct BanglaTranslatorApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          cat <<'EOF' > BanglaTranslator/Sources/AvroParser.swift
          import Foundation

          struct AvroParser {
              private static let rules: [(String, String)] = {
                  let raw: [(String, String)] = [
                      ("bb", "্ব"), ("cc", "্চ"), ("dd", "্ড"),
                      ("gg", "গ্গ"), ("jh", "ঝ"), ("ng", "ং"),
                      ("nn", "ন্ন"), ("rr", "র্র"), ("ss", "স্স"),
                      ("tt", "ট্ট"), ("kh", "খ"), ("bh", "ভ"),
                      ("ch", "ছ"), ("dh", "ধ"), ("gh", "ঘ"),
                      ("jh", "ঝ"), ("ph", "ফ"), ("th", "থ"),
                      ("sh", "শ"), ("Sh", "ষ"), ("rh", "ঢ়"),
                      ("ng", "ং"), ("ny", "ঞ"), ("Ng", "ঙ"),
                      ("a", "া"), ("A", "আ"), ("i", "ি"),
                      ("I", "ী"), ("u", "ু"), ("U", "ূ"),
                      ("e", "ে"), ("E", "ৈ"), ("o", "ো"),
                      ("O", "ৌ"), ("k", "ক"), ("K", "ক"),
                      ("g", "গ"), ("G", "গ"), ("c", "চ"),
                      ("C", "চ"), ("j", "জ"), ("J", "জ"),
                      ("t", "ত"), ("T", "ট"), ("d", "দ"),
                      ("D", "ড"), ("n", "ন"), ("N", "ণ"),
                      ("p", "প"), ("P", "প"), ("f", "ফ"),
                      ("F", "ফ"), ("b", "ব"), ("B", "ব"),
                      ("v", "ভ"), ("m", "ম"), ("M", "ম"),
                      ("r", "র"), ("R", "ড়"), ("l", "ল"),
                      ("L", "ল"), ("s", "স"), ("S", "স"),
                      ("h", "হ"), ("H", "হ"), ("y", "য"),
                      ("Y", "য়"), ("w", "ও"), ("x", "ক্স"),
                      ("z", "জ"), ("Z", "জ"), ("q", "ক"),
                      ("0", "০"), ("1", "১"), ("2", "২"),
                      ("3", "৩"), ("4", "৪"), ("5", "৫"),
                      ("6", "৬"), ("7", "৭"), ("8", "৮"),
                      ("9", "৯"),
                      (".", "।"), (",", ",")
                  ]
                  return raw.sorted { $0.0.count > $1.0.count }
              }()

              static func parse(_ input: String) -> String {
                  var remaining = input
                  var output = ""
                  while !remaining.isEmpty {
                      var matched = false
                      for (pattern, replacement) in rules {
                          if remaining.hasPrefix(pattern) {
                              output += replacement
                              remaining.removeFirst(pattern.count)
                              matched = true
                              break
                          }
                      }
                      if !matched {
                          output.append(remaining.removeFirst())
                      }
                  }
                  return output
              }
          }
          EOF

          cat <<'EOF' > BanglaTranslator/Sources/OfflineTranslationEngine.swift
          import Foundation

          class OfflineTranslationEngine: ObservableObject {
              
              // 1. Offline Dictionary Database
              private let dictionary: [String: String] = [
                  "আমি": "I", "তুমি": "you", "আপনি": "you", "সে": "he/she",
                  "আমরা": "we", "তারা": "they", "কাজ": "work", "প্রজেক্ট": "project",
                  "সাইট": "site", "রিপোর্ট": "report", "স্যার": "Sir",
                  "ধন্যবাদ": "thank you", "ভালো": "good", "খারাপ": "bad",
                  "জরুরি": "urgent", "শেষ": "completed", "চলছে": "ongoing",
                  "নতুন": "new", "পরিকল্পনা": "plan", "বিল্ডিং": "building",
                  "কাস্টিং": "casting", "ছাদ": "roof", "বেসমেন্ট": "basement",
                  "আজ": "today", "আগামীকাল": "tomorrow", "গতকাল": "yesterday",
                  "অনুমোদন": "approval", "সমস্যা": "issue", "সমাধান": "solution",
                  "টাকা": "money/budget", "মেটেরিয়াল": "materials", "মিটিং": "meeting"
              ]

              // 2. Offline Translation & Tone Transformation Logic
              func translateOffline(banglaText: String, phoneticText: String, tone: String) -> String {
                  guard !banglaText.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty else {
                      return ""
                  }

                  // Step A: Word-by-word local translation fallback
                  let words = banglaText.components(separatedBy: .whitespacesAndNewlines)
                  var translatedWords: [String] = []

                  for word in words {
                      let cleanWord = word.trimmingCharacters(in: .punctuationCharacters)
                      if let matchedEnglish = dictionary[cleanWord] {
                          translatedWords.append(matchedEnglish)
                      } else {
                          // Fallback to phonetic representation if word not in dictionary
                          translatedWords.append(cleanWord)
                      }
                  }

                  let baseSentence = translatedWords.joined(separator: " ")
                  
                  // Step B: Offline Grammar & Tone Formatting
                  return applyToneAndGrammar(baseSentence: baseSentence, originalPhonetic: phoneticText, tone: tone)
              }

              private func applyToneAndGrammar(baseSentence: String, originalPhonetic: String, tone: String) -> String {
                  // Standardized English sentence capitalization
                  let capitalized = baseSentence.prefix(1).capitalized + baseSentence.dropFirst()

                  switch tone {
                  case "boss":
                      return "Respected Chairman Sir,\n\nI would like to respectfully update you regarding the following: \(capitalized). We are ensuring all standards are strictly maintained.\n\nThank you,\nBest regards."
                      
                  case "management":
                      return "Dear Management Team,\n\nPlease be informed regarding the project update: \(capitalized). All tasks are being coordinated as per scheduled timeline.\n\nRegards."
                      
                  case "friendly":
                      return "Hey! Just wanted to share a quick update: \(capitalized). Hope everything is going smoothly on your end!"
                      
                  case "frank":
                      return "Haha, check this out: \(capitalized)! Pretty straightforward, right?"
                      
                  default:
                      return "\(capitalized)."
                  }
              }
          }
          EOF

          cat <<'EOF' > BanglaTranslator/Sources/ContentView.swift
          import SwiftUI

          struct ContentView: View {
              @State private var inputText = ""
              @State private var outputText = ""
              @State private var selectedTone = "friendly"
              @StateObject private var offlineEngine = OfflineTranslationEngine()

              let tones = [
                  ("friendly", "Friendly"),
                  ("management", "High Profile Mgmt"),
                  ("boss", "Big Boss / Chairman"),
                  ("frank", "Jokingly / Frank")
              ]

              var banglaText: String {
                  AvroParser.parse(inputText)
              }

              var body: some View {
                  NavigationView {
                      ScrollView {
                          VStack(spacing: 20) {
                              
                              // Input Section
                              VStack(alignment: .leading, spacing: 8) {
                                  Text("আপনার বাংলা / অভ্র ইনপুট (Offline)")
                                      .font(.headline)
                                  
                                  TextEditor(text: $inputText)
                                      .frame(height: 110)
                                      .padding(4)
                                      .background(Color(.systemBackground))
                                      .cornerRadius(8)
                                      .overlay(RoundedRectangle(cornerRadius: 8).stroke(Color.gray.opacity(0.4), lineWidth: 1))
                                  
                                  HStack {
                                      Text("Converted Bangla:")
                                          .font(.caption)
                                          .fontWeight(.bold)
                                      Text(banglaText.isEmpty ? "..." : banglaText)
                                          .font(.caption)
                                          .foregroundColor(.blue)
                                  }
                              }

                              // Tone Selector Section
                              VStack(alignment: .leading, spacing: 8) {
                                  Text("Select Tone Engine")
                                      .font(.headline)
                                  
                                  Picker("Tone", selection: $selectedTone) {
                                      ForEach(tones, id: \.0) { tone in
                                          Text(tone.1).tag(tone.0)
                                      }
                                  }
                                  .pickerStyle(SegmentedPickerStyle())
                                  .onChange(of: selectedTone) { _ in
                                      processTranslation()
                                  }
                              }

                              // Translate Action Button
                              Button(action: processTranslation) {
                                  HStack {
                                      Image(systemName: "bolt.fill")
                                      Text("Translate & Format (Offline)")
                                          .fontWeight(.semibold)
                                  }
                                  .frame(maxWidth: .infinity)
                                  .padding()
                                  .background(inputText.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty ? Color.gray : Color.blue)
                                  .foregroundColor(.white)
                                  .cornerRadius(10)
                              }
                              .disabled(inputText.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty)

                              // Output Section
                              VStack(alignment: .leading, spacing: 8) {
                                  Text("Grammatically Correct English Output")
                                      .font(.headline)
                                  
                                  TextEditor(text: .constant(outputText))
                                      .frame(height: 140)
                                      .padding(4)
                                      .background(Color(.secondarySystemBackground))
                                      .cornerRadius(8)
                                      .overlay(RoundedRectangle(cornerRadius: 8).stroke(Color.gray.opacity(0.3), lineWidth: 1))
                              }
                          }
                          .padding()
                      }
                      .navigationTitle("Offline Translator")
                      .onChange(of: inputText) { _ in
                          processTranslation()
                      }
                  }
              }

              private func processTranslation() {
                  let bangla = banglaText
                  if bangla.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty {
                      outputText = ""
                  } else {
                      outputText = offlineEngine.translateOffline(
                          banglaText: bangla,
                          phoneticText: inputText,
                          tone: selectedTone
                      )
                  }
              }
          }
          EOF

      - name: Write Info.plist
        run: |
          cat <<'EOF' > BanglaTranslator/Resources/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleDevelopmentRegion</key>
          	<string>$(DEVELOPMENT_LANGUAGE)</string>
          	<key>CFBundleExecutable</key>
          	<string>$(EXECUTABLE_NAME)</string>
          	<key>CFBundleIdentifier</key>
          	<string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
          	<key>CFBundleInfoDictionaryVersion</key>
          	<string>6.0</string>
          	<key>CFBundleName</key>
          	<string>$(PRODUCT_NAME)</string>
          	<key>CFBundlePackageType</key>
          	<string>APPL</string>
          	<key>CFBundleShortVersionString</key>
          	<string>1.0</string>
          	<key>CFBundleVersion</key>
          	<string>1</string>
          	<key>LSRequiresIPhoneOS</key>
          	<true/>
          	<key>UIApplicationSceneManifest</key>
          	<dict>
          		<key>UIApplicationSupportsMultipleScenes</key>
          		<false/>
          	</dict>
          	<key>UILaunchScreen</key>
          	<dict/>
          	<key>UISupportedInterfaceOrientations</key>
          	<array>
          		<string>UIInterfaceOrientationPortrait</string>
          		<string>UIInterfaceOrientationLandscapeLeft</string>
          		<string>UIInterfaceOrientationLandscapeRight</string>
          	</array>
          </dict>
          </plist>
          EOF

      - name: Create project.yml for XcodeGen
        run: |
          cat <<'EOF' > BanglaTranslator/project.yml
          name: BanglaTranslator
          options:
            bundleIdPrefix: com.example
            deploymentTarget:
              iOS: "16.0"
          settings:
            base:
              CODE_SIGN_STYLE: Manual
              CODE_SIGNING_ALLOWED: NO
              CODE_SIGNING_REQUIRED: NO
              CODE_SIGN_IDENTITY: ""
              PROVISIONING_PROFILE_SPECIFIER: ""
          targets:
            BanglaTranslator:
              type: application
              platform: iOS
              sources:
                - path: Sources
              resources:
                - path: Resources
              settings:
                base:
                  INFOPLIST_FILE: Resources/Info.plist
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.banglatranslator
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
          EOF

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: BanglaTranslator
        run: xcodegen generate

      - name: Archive Project
        run: |
          cd BanglaTranslator
          xcodebuild archive \
            -project BanglaTranslator.xcodeproj \
            -scheme BanglaTranslator \
            -configuration Release \
            -archivePath ../output/BanglaTranslator.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -destination 'generic/platform=iOS'

      - name: Package Unsigned IPA manually
        run: |
          mkdir -p output/ipa/Payload
          cp -R output/BanglaTranslator.xcarchive/Products/Applications/BanglaTranslator.app output/ipa/Payload/
          cd output/ipa
          zip -r BanglaTranslator.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BanglaTranslator.ipa
          path: output/ipa/BanglaTranslator.ipa
