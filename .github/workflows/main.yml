name: Build Unsigned IPA with XcodeGen

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Project structure ---
      - name: Create project directory and Swift files
        run: |
          mkdir -p BanglaTranslator/Sources
          mkdir -p BanglaTranslator/Resources

      - name: Write Swift source files
        run: |
          cat <<'EOF' > BanglaTranslator/Sources/BanglaTranslatorApp.swift
          import SwiftUI

          @main
          struct BanglaTranslatorApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          cat <<'EOF' > BanglaTranslator/Sources/AvroParser.swift
          import Foundation

          struct AvroParser {
              private static let rules: [(String, String)] = {
                  let raw: [(String, String)] = [
                      ("bb", "্ব"), ("cc", "্চ"), ("dd", "্ড"),
                      ("gg", "গ্গ"), ("jh", "ঝ"), ("ng", "ং"),
                      ("nn", "ন্ন"), ("rr", "র্র"), ("ss", "স্স"),
                      ("tt", "ট্ট"), ("kh", "খ"), ("bh", "ভ"),
                      ("ch", "ছ"), ("dh", "ধ"), ("gh", "ঘ"),
                      ("jh", "ঝ"), ("ph", "ফ"), ("th", "থ"),
                      ("sh", "শ"), ("Sh", "ষ"), ("rh", "ঢ়"),
                      ("ng", "ং"), ("ny", "ঞ"), ("Ng", "ঙ"),
                      ("a", "া"), ("A", "আ"), ("i", "ি"),
                      ("I", "ী"), ("u", "ু"), ("U", "ূ"),
                      ("e", "ে"), ("E", "ৈ"), ("o", "ো"),
                      ("O", "ৌ"), ("k", "ক"), ("K", "ক"),
                      ("g", "গ"), ("G", "গ"), ("c", "চ"),
                      ("C", "চ"), ("j", "জ"), ("J", "জ"),
                      ("t", "ত"), ("T", "ট"), ("d", "দ"),
                      ("D", "ড"), ("n", "ন"), ("N", "ণ"),
                      ("p", "প"), ("P", "প"), ("f", "ফ"),
                      ("F", "ফ"), ("b", "ব"), ("B", "ব"),
                      ("v", "ভ"), ("m", "ম"), ("M", "ম"),
                      ("r", "র"), ("R", "ড়"), ("l", "ল"),
                      ("L", "ল"), ("s", "স"), ("S", "স"),
                      ("h", "হ"), ("H", "হ"), ("y", "য"),
                      ("Y", "য়"), ("w", "ও"), ("x", "ক্স"),
                      ("z", "জ"), ("Z", "জ"), ("q", "ক"),
                      ("0", "০"), ("1", "১"), ("2", "২"),
                      ("3", "৩"), ("4", "৪"), ("5", "৫"),
                      ("6", "৬"), ("7", "৭"), ("8", "৮"),
                      ("9", "৯"),
                      (".", "।"), (",", ",")
                  ]
                  return raw.sorted { $0.0.count > $1.0.count }
              }()

              static func parse(_ input: String) -> String {
                  var remaining = input
                  var output = ""
                  while !remaining.isEmpty {
                      var matched = false
                      for (pattern, replacement) in rules {
                          if remaining.hasPrefix(pattern) {
                              output += replacement
                              remaining.removeFirst(pattern.count)
                              matched = true
                              break
                          }
                      }
                      if !matched {
                          output.append(remaining.removeFirst())
                      }
                  }
                  return output
              }
          }
          EOF

          cat <<'EOF' > BanglaTranslator/Sources/TranslationService.swift
          import Foundation

          class TranslationService: ObservableObject {
              func translate(banglaText: String, tone: String, apiKey: String) async throws -> String {
                  let systemPrompt: String
                  switch tone {
                  case "friendly":
                      systemPrompt = "Translate the following Bengali text into natural, friendly English. Make the grammar perfect and the tone warm and conversational."
                  case "management":
                      systemPrompt = "Translate the following Bengali text into English suitable for a high‑profile management message. Use professional, polished, and respectful language with perfect grammar."
                  case "boss":
                      systemPrompt = "Translate the following Bengali text into English as if writing to a big boss/chairman sir. The tone should be extremely formal, deferential, and grammatically flawless."
                  case "frank":
                      systemPrompt = "Translate the following Bengali text into English in a joking, frank, and casual manner. Make it sound witty but grammatically correct."
                  default:
                      systemPrompt = "Translate the following Bengali text into English with correct grammar."
                  }

                  let url = URL(string: "https://api.openai.com/v1/chat/completions")!
                  var request = URLRequest(url: url)
                  request.httpMethod = "POST"
                  request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  request.setValue("Bearer \(apiKey)", forHTTPHeaderField: "Authorization")

                  let body: [String: Any] = [
                      "model": "gpt-3.5-turbo",
                      "messages": [
                          ["role": "system", "content": systemPrompt],
                          ["role": "user", "content": banglaText]
                      ],
                      "temperature": 0.7
                  ]
                  request.httpBody = try JSONSerialization.data(withJSONObject: body)

                  let (data, response) = try await URLSession.shared.data(for: request)
                  guard let httpResponse = response as? HTTPURLResponse, httpResponse.statusCode == 200 else {
                      throw NSError(domain: "APIError", code: 1, userInfo: [NSLocalizedDescriptionKey: "API request failed"])
                  }

                  if let json = try JSONSerialization.jsonObject(with: data) as? [String: Any],
                     let choices = json["choices"] as? [[String: Any]],
                     let message = choices.first?["message"] as? [String: Any],
                     let content = message["content"] as? String {
                      return content.trimmingCharacters(in: .whitespacesAndNewlines)
                  } else {
                      throw NSError(domain: "APIError", code: 2, userInfo: [NSLocalizedDescriptionKey: "Invalid response"])
                  }
              }
          }
          EOF

          cat <<'EOF' > BanglaTranslator/Sources/SettingsView.swift
          import SwiftUI

          struct SettingsView: View {
              @AppStorage("openai_api_key") private var apiKey = ""
              @State private var showAlert = false

              var body: some View {
                  NavigationView {
                      Form {
                          Section(header: Text("OpenAI API Key")) {
                              SecureField("Enter your API key", text: $apiKey)
                              Button("Save") {
                                  showAlert = true
                              }
                          }
                      }
                      .navigationTitle("Settings")
                      .alert("Saved", isPresented: $showAlert) {
                          Button("OK", role: .cancel) { }
                      }
                  }
              }
          }
          EOF

          cat <<'EOF' > BanglaTranslator/Sources/ContentView.swift
          import SwiftUI

          struct ContentView: View {
              @State private var inputText = ""
              @State private var outputText = ""
              @State private var selectedTone = "friendly"
              @State private var isLoading = false
              @AppStorage("openai_api_key") private var apiKey = ""
              @StateObject private var translationService = TranslationService()
              @State private var showSettings = false

              let tones = [
                  ("friendly", "Friendly"),
                  ("management", "High Profile Mgmt"),
                  ("boss", "Big Boss / Chairman"),
                  ("frank", "Jokingly / Frank")
              ]

              var banglaText: String {
                  AvroParser.parse(inputText)
              }

              var body: some View {
                  NavigationView {
                      VStack(spacing: 16) {
                          VStack(alignment: .leading) {
                              Text("আপনার বাংলা / অভ্র ইনপুট")
                                  .font(.headline)
                              TextEditor(text: $inputText)
                                  .frame(minHeight: 120)
                                  .overlay(RoundedRectangle(cornerRadius: 8).stroke(Color.gray))
                              Text("Converted: \(banglaText)")
                                  .font(.caption)
                                  .foregroundColor(.secondary)
                          }

                          VStack(alignment: .leading) {
                              Text("Select Tone")
                                  .font(.headline)
                              Picker("Tone", selection: $selectedTone) {
                                  ForEach(tones, id: \.0) { tone in
                                      Text(tone.1).tag(tone.0)
                                  }
                              }
                              .pickerStyle(SegmentedPickerStyle())
                          }

                          Button(action: translate) {
                              HStack {
                                  if isLoading {
                                      ProgressView()
                                  }
                                  Text("Translate")
                              }
                          }
                          .disabled(inputText.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty || apiKey.isEmpty || isLoading)
                          .buttonStyle(.borderedProminent)

                          VStack(alignment: .leading) {
                              Text("Translated English")
                                  .font(.headline)
                              TextEditor(text: .constant(outputText))
                                  .frame(minHeight: 120)
                                  .overlay(RoundedRectangle(cornerRadius: 8).stroke(Color.gray))
                                  .disabled(true)
                          }
                      }
                      .padding()
                      .navigationTitle("Bangla Translator")
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button(action: { showSettings = true }) {
                                  Image(systemName: "gearshape")
                              }
                          }
                      }
                      .sheet(isPresented: $showSettings) {
                          SettingsView()
                      }
                  }
              }

              private func translate() {
                  guard !apiKey.isEmpty else { return }
                  isLoading = true
                  outputText = ""
                  Task {
                      do {
                          let result = try await translationService.translate(
                              banglaText: banglaText,
                              tone: selectedTone,
                              apiKey: apiKey
                          )
                          await MainActor.run {
                              outputText = result
                          }
                      } catch {
                          await MainActor.run {
                              outputText = "Error: \(error.localizedDescription)"
                          }
                      }
                      await MainActor.run {
                          isLoading = false
                      }
                  }
              }
          }
          EOF

      - name: Write Info.plist
        run: |
          cat <<'EOF' > BanglaTranslator/Resources/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleDevelopmentRegion</key>
          	<string>$(DEVELOPMENT_LANGUAGE)</string>
          	<key>CFBundleExecutable</key>
          	<string>$(EXECUTABLE_NAME)</string>
          	<key>CFBundleIdentifier</key>
          	<string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
          	<key>CFBundleInfoDictionaryVersion</key>
          	<string>6.0</string>
          	<key>CFBundleName</key>
          	<string>$(PRODUCT_NAME)</string>
          	<key>CFBundlePackageType</key>
          	<string>APPL</string>
          	<key>CFBundleShortVersionString</key>
          	<string>1.0</string>
          	<key>CFBundleVersion</key>
          	<string>1</string>
          	<key>LSRequiresIPhoneOS</key>
          	<true/>
          	<key>UIApplicationSceneManifest</key>
          	<dict>
          		<key>UIApplicationSupportsMultipleScenes</key>
          		<false/>
          	</dict>
          	<key>UILaunchScreen</key>
          	<dict/>
          	<key>UISupportedInterfaceOrientations</key>
          	<array>
          		<string>UIInterfaceOrientationPortrait</string>
          		<string>UIInterfaceOrientationLandscapeLeft</string>
          		<string>UIInterfaceOrientationLandscapeRight</string>
          	</array>
          </dict>
          </plist>
          EOF

      - name: Create project.yml for XcodeGen
        run: |
          cat <<'EOF' > BanglaTranslator/project.yml
          name: BanglaTranslator
          options:
            bundleIdPrefix: com.example
            deploymentTarget:
              iOS: "16.0"
          settings:
            base:
              CODE_SIGN_STYLE: Manual
              CODE_SIGNING_ALLOWED: NO
              CODE_SIGNING_REQUIRED: NO
              CODE_SIGN_IDENTITY: ""
              PROVISIONING_PROFILE_SPECIFIER: ""
              DEVELOPMENT_TEAM: ""
          targets:
            BanglaTranslator:
              type: application
              platform: iOS
              sources:
                - path: Sources
              resources:
                - path: Resources
              settings:
                base:
                  INFOPLIST_FILE: Resources/Info.plist
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.banglatranslator
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
          EOF

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: BanglaTranslator
        run: xcodegen generate

      - name: Create ExportOptions.plist
        run: |
          cat <<'EOF' > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>method</key>
          	<string>development</string>
          	<key>signingStyle</key>
          	<string>manual</string>
          	<key>signingCertificate</key>
          	<string>none</string>
          	<key>provisioningProfiles</key>
          	<dict/>
          </dict>
          </plist>
          EOF

      - name: Archive and Export IPA
        run: |
          cd BanglaTranslator
          xcodebuild archive \
            -project BanglaTranslator.xcodeproj \
            -scheme BanglaTranslator \
            -configuration Release \
            -archivePath ../output/BanglaTranslator.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -destination 'generic/platform=iOS'

          xcodebuild -exportArchive \
            -archivePath ../output/BanglaTranslator.xcarchive \
            -exportOptionsPlist ../ExportOptions.plist \
            -exportPath ../output/ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BanglaTranslator.ipa
          path: output/ipa/*.ipa
