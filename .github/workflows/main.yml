name: Build Unsigned IPA with XcodeGen (Fully Offline)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create project directory structure
        run: |
          mkdir -p BanglaTranslator/Sources
          mkdir -p BanglaTranslator/Resources

      - name: Download offline dictionary + grammar data
        run: |
          # Simple but usable Bangla↔English word dictionary (JSON)
          # You can later replace this URL with a bigger dictionary
          curl -L -o BanglaTranslator/Resources/dictionary.json \
            "https://raw.githubusercontent.com/nullsaint/BengaliDictionary/master/BengaliDictionary_17.csv" || true

          # Fallback: create a usable embedded dictionary if download fails
          cat << 'EOF' > BanglaTranslator/Resources/dictionary.json
          {
            "আমি": "I",
            "তুমি": "you",
            "সে": "he/she",
            "আমরা": "we",
            "তারা": "they",
            "ভালো": "good",
            "খারাপ": "bad",
            "ধন্যবাদ": "thank you",
            "স্বাগতম": "welcome",
            "নাম": "name",
            "কি": "what",
            "কেমন": "how",
            "আছেন": "are",
            "আছো": "are",
            "হ্যাঁ": "yes",
            "না": "no",
            "দয়া": "please",
            "করে": "do",
            "যাব": "will go",
            "যাচ্ছি": "going",
            "আসছি": "coming",
            "খাব": "will eat",
            "পানি": "water",
            "ভাত": "rice",
            "মাছ": "fish",
            "মাংস": "meat",
            "বাড়ি": "house/home",
            "স্কুল": "school",
            "অফিস": "office",
            "বন্ধু": "friend",
            "পরিবার": "family",
            "মা": "mother",
            "বাবা": "father",
            "ভাই": "brother",
            "বোন": "sister",
            "ভালোবাসা": "love",
            "সুন্দর": "beautiful",
            "বড়": "big",
            "ছোট": "small",
            "নতুন": "new",
            "পুরনো": "old",
            "আজ": "today",
            "কাল": "tomorrow/yesterday",
            "এখন": "now",
            "পরে": "later",
            "আগে": "before",
            "সাহায্য": "help",
            "দরকার": "need",
            "চাই": "want",
            "পারি": "can",
            "জানি": "know",
            "বুঝি": "understand",
            "বলি": "say",
            "শুনি": "hear/listen",
            "দেখি": "see",
            "যাই": "go",
            "আসি": "come",
            "খাই": "eat",
            "পড়ি": "read/study",
            "লিখি": "write",
            "কাজ": "work",
            "সময়": "time",
            "দিন": "day",
            "রাত": "night",
            "সকাল": "morning",
            "বিকাল": "afternoon",
            "সন্ধ্যা": "evening",
            "ভাষা": "language",
            "বাংলা": "Bengali/Bangla",
            "ইংরেজি": "English"
          }
          EOF

      - name: Write Swift source files (Fully Offline)
        run: |
          cat <<'EOF' > BanglaTranslator/Sources/BanglaTranslatorApp.swift
          import SwiftUI

          @main
          struct BanglaTranslatorApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          cat <<'EOF' > BanglaTranslator/Sources/AvroParser.swift
          import Foundation

          /// Classic Avro-style phonetic → Bangla converter (100% offline)
          struct AvroParser {
              private static let rules: [(String, String)] = {
                  let raw: [(String, String)] = [
                      // Multi-char first (longest match)
                      ("bb", "্ব"), ("cc", "্চ"), ("dd", "্ড"),
                      ("gg", "গ্গ"), ("jh", "ঝ"), ("ng", "ং"),
                      ("nn", "ন্ন"), ("rr", "র্র"), ("ss", "স্স"),
                      ("tt", "ট্ট"), ("kh", "খ"), ("bh", "ভ"),
                      ("ch", "ছ"), ("dh", "ধ"), ("gh", "ঘ"),
                      ("ph", "ফ"), ("th", "থ"), ("sh", "শ"),
                      ("Sh", "ষ"), ("rh", "ঢ়"), ("ny", "ঞ"),
                      ("Ng", "ঙ"),
                      // Vowels
                      ("a", "া"), ("A", "আ"), ("i", "ি"),
                      ("I", "ী"), ("u", "ু"), ("U", "ূ"),
                      ("e", "ে"), ("E", "ৈ"), ("o", "ো"),
                      ("O", "ৌ"),
                      // Consonants
                      ("k", "ক"), ("K", "ক"), ("g", "গ"), ("G", "গ"),
                      ("c", "চ"), ("C", "চ"), ("j", "জ"), ("J", "জ"),
                      ("t", "ত"), ("T", "ট"), ("d", "দ"), ("D", "ড"),
                      ("n", "ন"), ("N", "ণ"), ("p", "প"), ("P", "প"),
                      ("f", "ফ"), ("F", "ফ"), ("b", "ব"), ("B", "ব"),
                      ("v", "ভ"), ("m", "ম"), ("M", "ম"), ("r", "র"),
                      ("R", "ড়"), ("l", "ল"), ("L", "ল"), ("s", "স"),
                      ("S", "স"), ("h", "হ"), ("H", "হ"), ("y", "য"),
                      ("Y", "য়"), ("w", "ও"), ("x", "ক্স"),
                      ("z", "জ"), ("Z", "জ"), ("q", "ক"),
                      // Numbers
                      ("0", "০"), ("1", "১"), ("2", "২"), ("3", "৩"),
                      ("4", "৪"), ("5", "৫"), ("6", "৬"), ("7", "৭"),
                      ("8", "৮"), ("9", "৯"),
                      (".", "।"), (",", ",")
                  ]
                  return raw.sorted { $0.0.count > $1.0.count }
              }()

              static func parse(_ input: String) -> String {
                  var remaining = input
                  var output = ""
                  while !remaining.isEmpty {
                      var matched = false
                      for (pattern, replacement) in rules {
                          if remaining.hasPrefix(pattern) {
                              output += replacement
                              remaining.removeFirst(pattern.count)
                              matched = true
                              break
                          }
                      }
                      if !matched {
                          output.append(remaining.removeFirst())
                      }
                  }
                  return output
              }
          }
          EOF

          cat <<'EOF' > BanglaTranslator/Sources/OfflineTranslator.swift
          import Foundation

          /// Fully offline word-by-word + basic sentence translator
          class OfflineTranslator: ObservableObject {
              private var dictionary: [String: String] = [:]

              init() {
                  loadDictionary()
              }

              private func loadDictionary() {
                  guard let url = Bundle.main.url(forResource: "dictionary", withExtension: "json"),
                        let data = try? Data(contentsOf: url),
                        let dict = try? JSONSerialization.jsonObject(with: data) as? [String: String] else {
                      // Fallback hard-coded if resource missing
                      dictionary = [
                          "আমি": "I", "তুমি": "you", "সে": "he/she",
                          "ভালো": "good", "ধন্যবাদ": "thank you"
                      ]
                      return
                  }
                  dictionary = dict
              }

              /// Main offline translate function
              func translate(banglaText: String, tone: String) -> String {
                  let cleaned = banglaText
                      .trimmingCharacters(in: .whitespacesAndNewlines)
                      .replacingOccurrences(of: "।", with: ".")
                      .replacingOccurrences(of: "  ", with: " ")

                  guard !cleaned.isEmpty else { return "" }

                  // Split into words (simple)
                  let words = cleaned.components(separatedBy: CharacterSet.whitespacesAndNewlines)
                      .filter { !$0.isEmpty }

                  var translatedWords: [String] = []
                  for word in words {
                      let pure = word.trimmingCharacters(in: .punctuationCharacters)
                      if let eng = dictionary[pure] {
                          translatedWords.append(eng)
                      } else if let eng = dictionary[word] {
                          translatedWords.append(eng)
                      } else {
                          // Keep original Bangla word if not found
                          translatedWords.append(word)
                      }
                  }

                  var result = translatedWords.joined(separator: " ")

                  // Very light tone adjustment (offline)
                  switch tone {
                  case "management", "boss":
                      result = "Respected Sir/Madam, " + result.capitalized + "."
                  case "frank":
                      result = result + " 😄"
                  case "friendly":
                      result = result.capitalized
                  default:
                      break
                  }

                  return result
              }
          }
          EOF

          cat <<'EOF' > BanglaTranslator/Sources/ContentView.swift
          import SwiftUI

          struct ContentView: View {
              @State private var inputText = ""
              @State private var outputText = ""
              @State private var selectedTone = "friendly"
              @State private var isLoading = false
              @StateObject private var translator = OfflineTranslator()

              let tones = [
                  ("friendly", "Friendly"),
                  ("management", "High Profile Mgmt"),
                  ("boss", "Big Boss / Chairman"),
                  ("frank", "Jokingly / Frank")
              ]

              var banglaText: String {
                  AvroParser.parse(inputText)
              }

              var body: some View {
                  NavigationView {
                      VStack(spacing: 16) {
                          // Input
                          VStack(alignment: .leading, spacing: 6) {
                              Text("আপনার বাংলা / অভ্র ইনপুট")
                                  .font(.headline)
                              TextEditor(text: $inputText)
                                  .frame(minHeight: 110)
                                  .overlay(RoundedRectangle(cornerRadius: 8).stroke(Color.gray.opacity(0.5)))
                              Text("Converted Bangla: \(banglaText)")
                                  .font(.caption)
                                  .foregroundColor(.secondary)
                                  .lineLimit(2)
                          }

                          // Tone
                          VStack(alignment: .leading) {
                              Text("Select Tone")
                                  .font(.headline)
                              Picker("Tone", selection: $selectedTone) {
                                  ForEach(tones, id: \.0) { tone in
                                      Text(tone.1).tag(tone.0)
                                  }
                              }
                              .pickerStyle(SegmentedPickerStyle())
                          }

                          // Translate button
                          Button(action: translate) {
                              HStack {
                                  if isLoading { ProgressView().scaleEffect(0.8) }
                                  Text("Translate (Offline)")
                              }
                              .frame(maxWidth: .infinity)
                          }
                          .disabled(inputText.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty || isLoading)
                          .buttonStyle(.borderedProminent)

                          // Output
                          VStack(alignment: .leading, spacing: 6) {
                              Text("Translated English (Offline)")
                                  .font(.headline)
                              TextEditor(text: .constant(outputText))
                                  .frame(minHeight: 110)
                                  .overlay(RoundedRectangle(cornerRadius: 8).stroke(Color.gray.opacity(0.5)))
                                  .disabled(true)
                          }

                          Text("🔒 100% Offline • No API • Dictionary based")
                              .font(.caption2)
                              .foregroundColor(.secondary)
                      }
                      .padding()
                      .navigationTitle("Bangla Translator")
                  }
              }

              private func translate() {
                  isLoading = true
                  outputText = ""
                  // Tiny delay just for UI feedback
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.15) {
                      let result = translator.translate(
                          banglaText: banglaText,
                          tone: selectedTone
                      )
                      outputText = result
                      isLoading = false
                  }
              }
          }
          EOF

      - name: Write Info.plist
        run: |
          cat <<'EOF' > BanglaTranslator/Resources/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleDevelopmentRegion</key>
          	<string>$(DEVELOPMENT_LANGUAGE)</string>
          	<key>CFBundleExecutable</key>
          	<string>$(EXECUTABLE_NAME)</string>
          	<key>CFBundleIdentifier</key>
          	<string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
          	<key>CFBundleInfoDictionaryVersion</key>
          	<string>6.0</string>
          	<key>CFBundleName</key>
          	<string>$(PRODUCT_NAME)</string>
          	<key>CFBundlePackageType</key>
          	<string>APPL</string>
          	<key>CFBundleShortVersionString</key>
          	<string>1.0</string>
          	<key>CFBundleVersion</key>
          	<string>1</string>
          	<key>LSRequiresIPhoneOS</key>
          	<true/>
          	<key>UIApplicationSceneManifest</key>
          	<dict>
          		<key>UIApplicationSupportsMultipleScenes</key>
          		<false/>
          	</dict>
          	<key>UILaunchScreen</key>
          	<dict/>
          	<key>UISupportedInterfaceOrientations</key>
          	<array>
          		<string>UIInterfaceOrientationPortrait</string>
          		<string>UIInterfaceOrientationLandscapeLeft</string>
          		<string>UIInterfaceOrientationLandscapeRight</string>
          	</array>
          </dict>
          </plist>
          EOF

      - name: Create project.yml for XcodeGen
        run: |
          cat <<'EOF' > BanglaTranslator/project.yml
          name: BanglaTranslator
          options:
            bundleIdPrefix: com.example
            deploymentTarget:
              iOS: "16.0"
          settings:
            base:
              CODE_SIGN_STYLE: Manual
              CODE_SIGNING_ALLOWED: NO
              CODE_SIGNING_REQUIRED: NO
              CODE_SIGN_IDENTITY: ""
              PROVISIONING_PROFILE_SPECIFIER: ""
          targets:
            BanglaTranslator:
              type: application
              platform: iOS
              sources:
                - path: Sources
              resources:
                - path: Resources
              settings:
                base:
                  INFOPLIST_FILE: Resources/Info.plist
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.banglatranslator
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
          EOF

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: BanglaTranslator
        run: xcodegen generate

      - name: Archive Project (Unsigned)
        run: |
          cd BanglaTranslator
          xcodebuild archive \
            -project BanglaTranslator.xcodeproj \
            -scheme BanglaTranslator \
            -configuration Release \
            -archivePath ../output/BanglaTranslator.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -destination 'generic/platform=iOS'

      - name: Package Unsigned IPA
        run: |
          mkdir -p output/ipa/Payload
          cp -R output/BanglaTranslator.xcarchive/Products/Applications/BanglaTranslator.app output/ipa/Payload/
          cd output/ipa
          zip -r BanglaTranslator.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BanglaTranslator-Offline.ipa
          path: output/ipa/BanglaTranslator.ipa
