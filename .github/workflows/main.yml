name: Build Unsigned IPA for Bengali-English Translator

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Create project structure
        run: mkdir -p BengaliTranslator/Sources

      - name: Write xcodegen project spec (with Xcode 15 compatibility)
        run: |
          cat << 'EOF' > project.yml
          name: BengaliTranslator
          options:
            bundleIdPrefix: com.translator
            xcodeVersion: "15.0"
          targets:
            BengaliTranslator:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - BengaliTranslator/Sources
              settings:
                base:
                  INFOPLIST_FILE: BengaliTranslator/Sources/Info.plist
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGNING_ALLOWED: "NO"
                  PRODUCT_BUNDLE_IDENTIFIER: com.translator.bengali
                  GENERATE_INFOPLIST_FILE: "YES"
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
          EOF

      - name: Write Source Files
        run: |
          cat << 'EOF' > BengaliTranslator/Sources/BengaliTranslatorApp.swift
          import SwiftUI

          @main
          struct BengaliTranslatorApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          cat << 'EOF' > BengaliTranslator/Sources/AvroPhonetic.swift
          import Foundation

          class AvroPhonetic {
              private let mapping: [String: String] = [
                  "a":"া", "aa":"আ", "i":"ি", "ii":"ী",
                  "u":"ু", "uu":"ূ", "r":"র", "rr":"ড়",
                  "e":"ে", "oi":"ৈ", "o":"ো", "ou":"ৌ",
                  "k":"ক", "kh":"খ", "g":"গ", "gh":"ঘ", "ng":"ঙ",
                  "c":"চ", "ch":"ছ", "j":"জ", "jh":"ঝ", "nya":"ঞ",
                  "t":"ট", "th":"ঠ", "d":"ড", "dh":"ঢ", "n":"ন",
                  "p":"প", "ph":"ফ", "b":"ব", "bh":"ভ", "m":"ম",
                  "y":"য", "r":"র", "l":"ল", "sh":"শ", "ss":"ষ",
                  "s":"স", "h":"হ", "z":"জ", "":"্",
                  "0":"০","1":"১","2":"২","3":"৩","4":"৪",
                  "5":"৫","6":"৬","7":"৭","8":"৮","9":"৯"
              ]
              
              func convertToBengali(_ input: String) -> String {
                  let text = input.lowercased()
                  var bengali = ""
                  var i = text.startIndex
                  while i < text.endIndex {
                      var matched = false
                      for length in [4,3,2,1].reversed() {
                          let end = text.index(i, offsetBy: length, limitedBy: text.endIndex) ?? text.endIndex
                          let sub = String(text[i..<end])
                          if let replacement = mapping[sub] {
                              bengali += replacement
                              i = end
                              matched = true
                              break
                          }
                      }
                      if !matched {
                          bengali += String(text[i])
                          i = text.index(after: i)
                      }
                  }
                  return bengali
              }
          }
          EOF

          cat << 'EOF' > BengaliTranslator/Sources/ToneManager.swift
          enum Tone: String, CaseIterable, Identifiable {
              case friendly = "Friendly"
              case highProfile = "High Profile"
              case bigBoss = "Big Boss"
              case jokey = "Jokey"
              
              var id: String { self.rawValue }
          }

          struct ToneManager {
              static func apply(tone: Tone, to translation: String) -> String {
                  switch tone {
                  case .friendly:
                      return "Hey! 😊 \(translation)"
                  case .highProfile:
                      return "Dear Sir/Madam, I would like to inform you that \(translation)."
                  case .bigBoss:
                      return "FYI: \(translation). Please take necessary action."
                  case .jokey:
                      return "So, basically \(translation) – if you know what I mean! 😉"
                  }
              }
          }
          EOF

          cat << 'EOF' > BengaliTranslator/Sources/TranslationService.swift
          import Foundation

          class TranslationService {
              // TODO: Add your Core ML model (BengaliToEnglish.mlmodel) to the project
              func translateMock(_ bengali: String, tone: Tone, completion: @escaping (String) -> Void) {
                  let placeholder = "Translation model not included. Add BengaliToEnglish.mlmodel."
                  DispatchQueue.main.async {
                      completion(ToneManager.apply(tone: tone, to: placeholder))
                  }
              }
          }
          EOF

          cat << 'EOF' > BengaliTranslator/Sources/ContentView.swift
          import SwiftUI

          struct ContentView: View {
              @State private var inputText: String = ""
              @State private var translatedText: String = ""
              @State private var selectedTone: Tone = .friendly
              private let avro = AvroPhonetic()
              private let translator = TranslationService()
              
              var body: some View {
                  VStack(spacing: 20) {
                      Text("Bengali Avro → English")
                          .font(.title.bold())
                      
                      TextField("লিখুন (Avro বা বাংলা মিক্স)...", text: $inputText)
                          .textFieldStyle(.roundedBorder)
                          .font(.system(size: 20))
                          .padding(.horizontal)
                      
                      Picker("Tone", selection: $selectedTone) {
                          ForEach(Tone.allCases) { tone in
                              Text(tone.rawValue).tag(tone)
                          }
                      }
                      .pickerStyle(.segmented)
                      .padding(.horizontal)
                      
                      Button("Translate") {
                          processAndTranslate()
                      }
                      .buttonStyle(.borderedProminent)
                      .padding()
                      
                      TextEditor(text: .constant(translatedText))
                          .frame(minHeight: 150)
                          .border(Color.gray, width: 1)
                          .padding(.horizontal)
                          .font(.system(size: 18))
                      
                      Spacer()
                  }
                  .padding()
              }
              
              func processAndTranslate() {
                  let containsBengali = inputText.unicodeScalars.contains { scalar in
                      (0x0980...0x09FF).contains(scalar.value)
                  }
                  let bengaliText: String
                  if containsBengali {
                      bengaliText = inputText
                  } else {
                      bengaliText = avro.convertToBengali(inputText)
                  }
                  
                  translator.translateMock(bengaliText, tone: selectedTone) { result in
                      translatedText = result
                  }
              }
          }
          EOF

          cat << 'EOF' > BengaliTranslator/Sources/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Bengali Translator</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Generate Xcode project (Compatible with Xcode 15)
        run: |
          xcodegen --spec project.yml --project .
        shell: bash

      - name: Build archive
        run: |
          xcodebuild archive \
            -project BengaliTranslator.xcodeproj \
            -scheme BengaliTranslator \
            -archivePath BengaliTranslator.xcarchive \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create export options for unsigned IPA
        run: |
          cat << 'EOF' > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict/>
              <key>teamID</key>
              <string></string>
          </dict>
          </plist>
          EOF

      - name: Export unsigned IPA
        run: |
          mkdir output
          xcodebuild -exportArchive \
            -archivePath BengaliTranslator.xcarchive \
            -exportPath output \
            -exportOptionsPlist exportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BengaliTranslator-unsigned
          path: output/*.ipa
