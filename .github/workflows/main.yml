      - name: Create Info.plist
        run: |
          cat <<'EOF' > BanglaTranslator/BanglaTranslator/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleDevelopmentRegion</key>
          	<string>$(DEVELOPMENT_LANGUAGE)</string>
          	<key>CFBundleExecutable</key>
          	<string>$(EXECUTABLE_NAME)</string>
          	<key>CFBundleIdentifier</key>
          	<string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
          	<key>CFBundleInfoDictionaryVersion</key>
          	<string>6.0</string>
          	<key>CFBundleName</key>
          	<string>$(PRODUCT_NAME)</string>
          	<key>CFBundlePackageType</key>
          	<string>APPL</string>
          	<key>CFBundleShortVersionString</key>
          	<string>1.0</string>
          	<key>CFBundleVersion</key>
          	<string>1</string>
          	<key>LSRequiresIPhoneOS</key>
          	<true/>
          	<key>UIApplicationSceneManifest</key>
          	<dict>
          		<key>UIApplicationSupportsMultipleScenes</key>
          		<false/>
          	</dict>
          	<key>UILaunchScreen</key>
          	<dict/>
          	<key>UISupportedInterfaceOrientations</key>
          	<array>
          		<string>UIInterfaceOrientationPortrait</string>
          		<string>UIInterfaceOrientationLandscapeLeft</string>
          		<string>UIInterfaceOrientationLandscapeRight</string>
          	</array>
          </dict>
          </plist>
          EOF

      - name: Create ExportOptions.plist
        run: |
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>method</key>
          	<string>development</string>
          	<key>signingStyle</key>
          	<string>manual</string>
          	<key>signingCertificate</key>
          	<string>none</string>
          	<key>provisioningProfiles</key>
          	<dict/>
          </dict>
          </plist>
          EOF

      - name: Archive & Export IPA
        run: |
          cd BanglaTranslator
          xcodebuild archive \
            -project BanglaTranslator.xcodeproj \
            -scheme BanglaTranslator \
            -configuration Release \
            -archivePath ../output/BanglaTranslator.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            -destination 'generic/platform=iOS'

          xcodebuild -exportArchive \
            -archivePath ../output/BanglaTranslator.xcarchive \
            -exportOptionsPlist ../ExportOptions.plist \
            -exportPath ../output/ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BanglaTranslator.ipa
          path: output/ipa/*.ipa
