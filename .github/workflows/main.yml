name: Build Fully Offline Unsigned IPA with XcodeGen

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create project directory and Swift files
        run: |
          mkdir -p BanglaTranslator/Sources
          mkdir -p BanglaTranslator/Resources

      - name: Write Swift source files
        run: |
          cat <<'EOF' > BanglaTranslator/Sources/BanglaTranslatorApp.swift
          import SwiftUI

          @main
          struct BanglaTranslatorApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          cat <<'EOF' > BanglaTranslator/Sources/AvroParser.swift
          import Foundation

          struct AvroParser {
              private static let rules: [(String, String)] = {
                  let raw: [(String, String)] = [
                      ("bb", "্ব"), ("cc", "্চ"), ("dd", "্ড"),
                      ("gg", "গ্গ"), ("jh", "ঝ"), ("ng", "ং"),
                      ("nn", "ন্ন"), ("rr", "র্র"), ("ss", "স্স"),
                      ("tt", "ট্ট"), ("kh", "খ"), ("bh", "ভ"),
                      ("ch", "ছ"), ("dh", "ধ"), ("gh", "ঘ"),
                      ("jh", "ঝ"), ("ph", "ফ"), ("th", "থ"),
                      ("sh", "শ"), ("Sh", "ষ"), ("rh", "ঢ়"),
                      ("ng", "ং"), ("ny", "ঞ"), ("Ng", "ঙ"),
                      ("a", "া"), ("A", "আ"), ("i", "ি"),
                      ("I", "ী"), ("u", "ু"), ("U", "ূ"),
                      ("e", "ে"), ("E", "ৈ"), ("o", "ো"),
                      ("O", "ৌ"), ("k", "ক"), ("K", "ক"),
                      ("g", "গ"), ("G", "গ"), ("c", "চ"),
                      ("C", "চ"), ("j", "জ"), ("J", "জ"),
                      ("t", "ত"), ("T", "ট"), ("d", "দ"),
                      ("D", "ড"), ("n", "ন"), ("N", "ণ"),
                      ("p", "প"), ("P", "প"), ("f", "ফ"),
                      ("F", "ফ"), ("b", "ব"), ("B", "ব"),
                      ("v", "ভ"), ("m", "ম"), ("M", "ম"),
                      ("r", "র"), ("R", "ড়"), ("l", "ল"),
                      ("L", "ল"), ("s", "স"), ("S", "স"),
                      ("h", "হ"), ("H", "হ"), ("y", "য"),
                      ("Y", "য়"), ("w", "ও"), ("x", "ক্স"),
                      ("z", "জ"), ("Z", "জ"), ("q", "ক"),
                      ("0", "০"), ("1", "১"), ("2", "২"),
                      ("3", "৩"), ("4", "৪"), ("5", "৫"),
                      ("6", "৬"), ("7", "৭"), ("8", "৮"),
                      ("9", "৯"),
                      (".", "।"), (",", ",")
                  ]
                  return raw.sorted { $0.0.count > $1.0.count }
              }()

              static func parse(_ input: String) -> String {
                  var remaining = input
                  var output = ""
                  while !remaining.isEmpty {
                      var matched = false
                      for (pattern, replacement) in rules {
                          if remaining.hasPrefix(pattern) {
                              output += replacement
                              remaining.removeFirst(pattern.count)
                              matched = true
                              break
                          }
                      }
                      if !matched {
                          output.append(remaining.removeFirst())
                      }
                  }
                  return output
              }
          }
          EOF

          cat <<'EOF' > BanglaTranslator/Sources/TranslationService.swift
          import Foundation

          class TranslationService: ObservableObject {
              // 100% Offline Translation & Tone Transformation Engine
              func translate(banglaText: String, tone: String) async -> String {
                  // Simulate light processing delay for responsive UI
                  try? await Task.sleep(nanoseconds: 300_000_000)

                  let cleanedText = banglaText.trimmingCharacters(in: .whitespacesAndNewlines)
                  if cleanedText.isEmpty { return "" }

                  // Local phrase mappings for offline conversion
                  let offlineDictionary: [String: String] = [
                      "আমি ভালো আছি": "I am doing well",
                      "আপনি কেমন আছেন": "How are you doing",
                      "কাজটি শেষ হয়েছে": "The task has been completed",
                      "স্যার আপডেট দিন": "Sir, please provide an update",
                      "আজকের কাজের অগ্রগতি": "Today's work progress status",
                      "ধন্যবাদ": "Thank you very much"
                  ]

                  var baseEnglish = offlineDictionary[cleanedText] ?? cleanedText

                  // Fallback phonetic/basic word conversion if exact match not found
                  if baseEnglish == cleanedText {
                      baseEnglish = offlineTransliterate(cleanedText)
                  }

                  // Apply Tone and Grammar Rules
                  return applyGrammarAndTone(englishText: baseEnglish, tone: tone)
              }

              private func offlineTransliterate(_ input: String) -> String {
                  // Basic offline sentence structure cleaner
                  var result = input
                  let replacements = [
                      "স্যার": "Sir",
                      "কাজ": "work",
                      "শেষ": "completed",
                      "বোর্ড": "board",
                      "রিপোর্ট": "report",
                      "ধন্যবাদ": "thanks"
                  ]
                  for (key, val) in replacements {
                      result = result.replacingOccurrences(of: key, with: val)
                  }
                  return result
              }

              private func applyGrammarAndTone(englishText: String, tone: String) -> String {
                  let formattedText = englishText.prefix(1).capitalized + englishText.dropFirst()

                  switch tone {
                  case "boss":
                      return "Respected Chairman Sir,\n\nI would like to inform you that \(formattedText.lowercased()). Everything is being processed strictly according to standard procedures.\n\nRespectfully,\nYour Team"
                  case "management":
                      return "Dear Management,\n\nPlease be updated that \(formattedText.lowercased()). All progress is aligned with our target schedule.\n\nBest regards,"
                  case "frank":
                      return "Hey! Just wanted to let you know — \(formattedText.lowercased()) 😄. Catch you later!"
                  case "friendly":
                      return "Hi there! Hope you are having a great day. Just wanted to share that \(formattedText.lowercased()). Have a good one!"
                  default:
                      return "\(formattedText)."
                  }
              }
          }
          EOF

          cat <<'EOF' > BanglaTranslator/Sources/SettingsView.swift
          import SwiftUI

          struct SettingsView: View {
              var body: some View {
                  NavigationView {
                      List {
                          Section(header: Text("App Mode")) {
                              HStack {
                                  Image(systemName: "checkmark.seal.fill")
                                      .foregroundColor(.green)
                                  Text("100% Offline Engine Active")
                              }
                          }
                          Section(header: Text("About")) {
                              Text("Bangla Phonetic & Tone Translator")
                              Text("Version: 1.0.0 (Offline Build)")
                                  .font(.caption)
                                  .foregroundColor(.secondary)
                          }
                      }
                      .navigationTitle("Settings")
                  }
              }
          }
          EOF

          cat <<'EOF' > BanglaTranslator/Sources/ContentView.swift
          import SwiftUI

          struct ContentView: View {
              @State private var inputText = ""
              @State private var outputText = ""
              @State private var selectedTone = "management"
              @State private var isLoading = false
              @StateObject private var translationService = TranslationService()
              @State private var showSettings = false

              let tones = [
                  ("friendly", "Friendly"),
                  ("management", "High Profile Mgmt"),
                  ("boss", "Big Boss / Chairman"),
                  ("frank", "Jokingly / Frank")
              ]

              var banglaText: String {
                  AvroParser.parse(inputText)
              }

              var body: some View {
                  NavigationView {
                      VStack(spacing: 16) {
                          VStack(alignment: .leading) {
                              Text("আপনার বাংলা / অভ্র ইনপুট")
                                  .font(.headline)
                              TextEditor(text: $inputText)
                                  .frame(minHeight: 100)
                                  .overlay(RoundedRectangle(cornerRadius: 8).stroke(Color.gray.opacity(0.5)))
                              Text("Avro Phonetic: \(banglaText)")
                                  .font(.caption)
                                  .foregroundColor(.blue)
                          }

                          VStack(alignment: .leading) {
                              Text("Select Tone / Grammar Style")
                                  .font(.headline)
                              Picker("Tone", selection: $selectedTone) {
                                  ForEach(tones, id: \.0) { tone in
                                      Text(tone.1).tag(tone.0)
                                  }
                              }
                              .pickerStyle(SegmentedPickerStyle())
                          }

                          Button(action: translate) {
                              HStack {
                                  if isLoading {
                                      ProgressView()
                                          .padding(.trailing, 5)
                                  }
                                  Text("Offline Translate & Format")
                                      .bold()
                              }
                              .frame(maxWidth: .infinity)
                              .padding()
                          }
                          .disabled(inputText.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty || isLoading)
                          .buttonStyle(.borderedProminent)

                          VStack(alignment: .leading) {
                              Text("Grammatically Corrected English")
                                  .font(.headline)
                              TextEditor(text: .constant(outputText))
                                  .frame(minHeight: 120)
                                  .overlay(RoundedRectangle(cornerRadius: 8).stroke(Color.gray.opacity(0.5)))
                                  .disabled(true)
                          }
                      }
                      .padding()
                      .navigationTitle("Bangla Offline AI")
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button(action: { showSettings = true }) {
                                  Image(systemName: "gearshape")
                              }
                          }
                      }
                      .sheet(isPresented: $showSettings) {
                          SettingsView()
                      }
                  }
              }

              private func translate() {
                  isLoading = true
                  outputText = ""
                  Task {
                      let result = await translationService.translate(
                          banglaText: banglaText,
                          tone: selectedTone
                      )
                      await MainActor.run {
                          outputText = result
                          isLoading = false
                      }
                  }
              }
          }
          EOF

      - name: Write Info.plist
        run: |
          cat <<'EOF' > BanglaTranslator/Resources/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleDevelopmentRegion</key>
          	<string>$(DEVELOPMENT_LANGUAGE)</string>
          	<key>CFBundleExecutable</key>
          	<string>$(EXECUTABLE_NAME)</string>
          	<key>CFBundleIdentifier</key>
          	<string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
          	<key>CFBundleInfoDictionaryVersion</key>
          	<string>6.0</string>
          	<key>CFBundleName</key>
          	<string>$(PRODUCT_NAME)</string>
          	<key>CFBundlePackageType</key>
          	<string>APPL</string>
          	<key>CFBundleShortVersionString</key>
          	<string>1.0</string>
          	<key>CFBundleVersion</key>
          	<string>1</string>
          	<key>LSRequiresIPhoneOS</key>
          	<true/>
          	<key>UIApplicationSceneManifest</key>
          	<dict>
          		<key>UIApplicationSupportsMultipleScenes</key>
          		<false/>
          	</dict>
          	<key>UILaunchScreen</key>
          	<dict/>
          	<key>UISupportedInterfaceOrientations</key>
          	<array>
          		<string>UIInterfaceOrientationPortrait</string>
          		<string>UIInterfaceOrientationLandscapeLeft</string>
          		<string>UIInterfaceOrientationLandscapeRight</string>
          	</array>
          </dict>
          </plist>
          EOF

      - name: Create project.yml for XcodeGen
        run: |
          cat <<'EOF' > BanglaTranslator/project.yml
          name: BanglaTranslator
          options:
            bundleIdPrefix: com.example
            deploymentTarget:
              iOS: "16.0"
          settings:
            base:
              CODE_SIGN_STYLE: Manual
              CODE_SIGNING_ALLOWED: NO
              CODE_SIGNING_REQUIRED: NO
              CODE_SIGN_IDENTITY: ""
              PROVISIONING_PROFILE_SPECIFIER: ""
          targets:
            BanglaTranslator:
              type: application
              platform: iOS
              sources:
                - path: Sources
              resources:
                - path: Resources
              settings:
                base:
                  INFOPLIST_FILE: Resources/Info.plist
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.banglatranslator
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
          EOF

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: BanglaTranslator
        run: xcodegen generate

      - name: Archive Project
        run: |
          cd BanglaTranslator
          xcodebuild archive \
            -project BanglaTranslator.xcodeproj \
            -scheme BanglaTranslator \
            -configuration Release \
            -archivePath ../output/BanglaTranslator.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -destination 'generic/platform/iOS'

      - name: Package Unsigned IPA manually
        run: |
          mkdir -p output/ipa/Payload
          cp -R output/BanglaTranslator.xcarchive/Products/Applications/BanglaTranslator.app output/ipa/Payload/
          cd output/ipa
          zip -r BanglaTranslator.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BanglaTranslator.ipa
          path: output/ipa/BanglaTranslator.ipa
